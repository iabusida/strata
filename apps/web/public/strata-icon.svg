<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-150%" width="260%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#070D1A"/>

  <!-- 5 strata bars, right-aligned at x=58, height=8px, gap=3px
       total = 5×8 + 4×3 = 52px, top_y = (64-52)/2 = 6 -->

  <!-- Bar 1 — bottom -->
  <rect x="6"  y="50" width="52" height="8" rx="4" fill="#1E3A6E"/>
  <!-- Bar 2 -->
  <rect x="13" y="39" width="45" height="8" rx="4" fill="#1D4ED8"/>
  <!-- Bar 3 -->
  <rect x="21" y="28" width="37" height="8" rx="4" fill="url(#blueGrad)"/>
  <!-- Bar 4 -->
  <rect x="31" y="17" width="27" height="8" rx="4" fill="#3B82F6"/>
  <!-- Bar 5 — top, cyan glow -->
  <rect x="42" y="6"  width="16" height="8" rx="4" fill="url(#cyanGrad)" filter="url(#glow)"/>
</svg>
