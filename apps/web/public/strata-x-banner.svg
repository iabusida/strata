<svg width="1500" height="500" viewBox="0 0 1500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="strataSweep" x1="14" y1="114" x2="114" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A1326"/>
      <stop offset="55%" stop-color="#070C18"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="1080" cy="120" r="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="260" cy="420" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="120" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFFAFE"/>
    </linearGradient>
    <linearGradient id="nodeCore" x1="86" y1="26" x2="112" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <!-- Subtle, contained top glow (enhanced but not oversized) -->
    <radialGradient id="markTopGlow" cx="98" cy="10" r="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.29"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="barShadow" x="-30%" y="-30%" width="160%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#020409" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1500" height="500" fill="url(#panel)"/>
  <rect x="0" y="0" width="1500" height="500" fill="url(#leftGlow)"/>
  <rect x="0" y="0" width="1500" height="500" fill="url(#heroGlow)"/>

  <!-- Faint baseline grid for a quiet "markets" texture -->
  <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="125" x2="1500" y2="125"/>
    <line x1="0" y1="250" x2="1500" y2="250"/>
    <line x1="0" y1="375" x2="1500" y2="375"/>
  </g>

  <!-- ── Text block (left). Hierarchy: title ▸ subheading ▸ hook ▸ credibility ── -->
  <!-- H1: bold, large, tight tracking, primary white -->
  <text x="120" y="186" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="116" font-weight="800" letter-spacing="-4" fill="url(#wordmark)">Strata</text>

  <!-- Subheading: medium weight, reduced opacity (~78%) -->
  <text x="124" y="236" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="0.4" fill="#FFFFFF" fill-opacity="0.78">Signal intelligence for crypto &amp; stocks</text>

  <!-- Hook line: semi-bold, cyan accent — most dominant line after the title -->
  <text x="123" y="324" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" fill="#67E8F9">See the move before it moves.</text>

  <!-- Credibility line: small, muted (~55%), minimal emphasis, generous spacing above -->
  <text x="124" y="392" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="0.6" fill="#FFFFFF" fill-opacity="0.62">Data&#8209;driven signals. No hype.</text>

  <!-- ── Strata mark (right). Refined: thinner bars, more spacing, subtle top glow ── -->
  <g transform="translate(1150 250) scale(2.55) translate(-65 -56)">
    <!-- contained top glow -->
    <rect x="40" y="-26" width="120" height="120" fill="url(#markTopGlow)"/>

    <!-- Ascending strata bars (thinner ~12%, increased vertical gaps) -->
    <g filter="url(#barShadow)">
      <rect x="18" y="94" width="92" height="12" rx="3" fill="url(#strataSweep)" opacity="0.56"/>
      <rect x="28" y="72" width="80" height="11" rx="3" fill="url(#strataSweep)" opacity="0.66"/>
      <rect x="42" y="49" width="64" height="11" rx="3.4" fill="url(#strataSweep)" opacity="0.85"/>
      <rect x="60" y="26" width="44" height="12" rx="3.8" fill="url(#strataSweep)"/>
    </g>

    <!-- Sheen highlights along the climbing edges -->
    <path d="M64 32 L104 32" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M46 55 L106 55" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Glowing decision node -->
    <g filter="url(#nodeGlow)">
      <rect x="84" y="8" width="28" height="10" rx="3.4" fill="url(#nodeCore)"/>
    </g>
    <rect x="84" y="8" width="28" height="10" rx="3.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
  </g>
</svg>
