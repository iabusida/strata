<svg width="512" height="512" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Diagonal brand sweep: deep blue -> electric cyan -->
    <linearGradient id="strataSweep" x1="14" y1="114" x2="114" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Panel background gradient -->
    <linearGradient id="panel" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A1326"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>

    <!-- Soft top-light radial glow -->
    <radialGradient id="topGlow" cx="78" cy="20" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Node core gradient -->
    <linearGradient id="nodeCore" x1="86" y1="26" x2="112" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Glow filter for the decision node (premium fintech, not neon) -->
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle drop shadow under bars for depth -->
    <filter id="barShadow" x="-30%" y="-30%" width="160%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#020409" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Full-bleed background (no rounded corners: the circular avatar mask handles the shape) -->
  <rect x="0" y="0" width="128" height="128" fill="url(#panel)"/>
  <rect x="0" y="0" width="128" height="128" fill="url(#topGlow)"/>

  <!--
    Mark content scaled to ~0.74 and re-centered on the frame center (64,64) so
    nothing touches the circular crop edge. Original content centroid ≈ (65,59).
  -->
  <g transform="translate(64 66) scale(0.74) translate(-65 -56)">
    <!-- Ascending strata bars (thinner ~12%, increased vertical gaps) -->
    <g filter="url(#barShadow)">
      <rect x="18" y="94" width="92" height="12" rx="3" fill="url(#strataSweep)" opacity="0.56"/>
      <rect x="28" y="72" width="80" height="11" rx="3" fill="url(#strataSweep)" opacity="0.66"/>
      <rect x="42" y="49" width="64" height="11" rx="3.4" fill="url(#strataSweep)" opacity="0.85"/>
      <rect x="60" y="26" width="44" height="12" rx="3.8" fill="url(#strataSweep)"/>
    </g>

    <!-- Sheen highlight along the climbing edge -->
    <path d="M64 32 L104 32" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M46 55 L106 55" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Glowing decision node -->
    <g filter="url(#nodeGlow)">
      <rect x="84" y="8" width="28" height="10" rx="3.4" fill="url(#nodeCore)"/>
    </g>
    <rect x="84" y="8" width="28" height="10" rx="3.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
  </g>
</svg>
